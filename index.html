  <title>Trang chủ tổng hợp bài tập</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.6;
      padding: 28px 16px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 26px 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .profile-box {
      background-color: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 22px;
    }
    .profile-box h1 {
      font-size: 1.4rem;
      color: #1e3a8a;
      margin-bottom: 6px;
    }
    .profile-box p {
      font-size: 1rem;
      font-weight: 600;
    }
    h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
    }
    .menu {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }
    .menu a {
      display: block;
      padding: 12px 14px;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
    }
    .menu a:hover {
      background-color: #eff6ff;
      border-color: #2563eb;
      color: #1d4ed8;
    }
  </style>
</head>
